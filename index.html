<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayou Boudin &amp; Bites</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Responsive Header with fluid padding and text scaling -->
  <header class="bg-primary text-center py-5 px-3 text-white">
    <div class="container">
      <h1 class="display-5 display-md-4 fw-bold">Bayou Boudin &amp; Bites</h1>
      <p class="lead fs-6 fs-md-5">Serving up authentic Creole and Cajun favorites hot off the grill!</p>
      <p id="weather" class="fw-semibold mt-3"></p>
      <a href="#menu" class="btn btn-danger btn-lg mt-2">See the menu</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container py-5 px-3 px-md-0">
    <section id="menu">
      <h2 class="mb-4 text-center text-md-start">Menu</h2>
      <!-- Row container where JavaScript injects responsive column cards -->
      <div class="row g-4 justify-content-center" id="menu-container"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
